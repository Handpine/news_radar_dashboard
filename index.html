<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>新聞雷達儀表板</title>
  
  <!-- iOS Web App Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="新聞雷達">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.json">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    /* Premium Color Palette Tokens */
    :root {
      --bg-color: #0c0e12; /* Quiet luxury deep charcoal/slate */
      --panel-bg: rgba(18, 22, 30, 0.85);
      --card-bg: rgba(25, 30, 41, 0.45);
      --card-hover-bg: rgba(35, 42, 58, 0.6);
      --border-color: rgba(196, 164, 117, 0.15); /* Soft champagne gold border */
      --border-glow: rgba(196, 164, 117, 0.3);
      --text-primary: #f1f3f5;
      --text-secondary: #a5b4c4;
      --text-muted: #627284;
      --accent: #c4a475; /* Elegant Champagne Gold from icon.png */
      --accent-glow: rgba(196, 164, 117, 0.15);
      --accent-hover: #d5b88f;
      --accent-gold: #c4a475;
      --success: #a3b899; /* Quiet sage green */
      --success-bg: rgba(163, 184, 153, 0.1);
      --missing: #1a1f29;
      --shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.6);
      --notch-padding: 0px;
    }

    [data-theme="light"] {
      --bg-color: #f9f8f6; /* Premium warm silk/ivory background */
      --panel-bg: rgba(255, 255, 255, 0.85);
      --card-bg: rgba(243, 241, 237, 0.65);
      --card-hover-bg: rgba(255, 255, 255, 0.95);
      --border-color: rgba(160, 132, 91, 0.25);
      --border-glow: rgba(160, 132, 91, 0.18);
      --text-primary: #2d2a26; /* Deep charcoal/warm bronze-gray */
      --text-secondary: #6e675f;
      --text-muted: #a0978d;
      --accent: #a0845b; /* Soft gold-bronze */
      --accent-glow: rgba(160, 132, 91, 0.12);
      --accent-hover: #bda37c;
      --shadow: 0 12px 40px 0 rgba(160, 132, 91, 0.06);
    }

    /* Reset and Core Layout */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      transition: background-color 0.4s ease, color 0.4s ease;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* Header Styling */
    header {
      background: var(--panel-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-color);
      padding: 1rem 1.5rem;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-title {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 1.25rem;
      letter-spacing: 0.08em;
      background: linear-gradient(135deg, var(--text-primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      width: 2.5rem;
      height: 2.5rem;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .icon-btn:hover {
      background: var(--accent-glow);
      border-color: var(--accent);
      transform: scale(1.05);
    }

    .icon-btn:active {
      transform: scale(0.95);
    }

    /* Main Container & App Tabs */
    main {
      flex: 1;
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      padding: 1.5rem 1rem 5rem 1rem; /* Extra bottom padding for floating nav */
    }

    .app-tab-content {
      display: none;
      animation: fadeIn 0.4s ease;
    }

    .app-tab-content.active {
      display: block;
    }

    /* Tab: This Week Dashboard */
    .section-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .weekly-summary-section {
      margin-bottom: 2rem;
    }

    /* Premium Dashboard Cards */
    .card {
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 1.25rem;
      box-shadow: var(--shadow);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: var(--accent);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .card.active {
      cursor: pointer;
    }

    .card.active:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
      box-shadow: 0 12px 24px 0 var(--border-glow);
    }

    .card.active:hover::before {
      opacity: 1;
    }

    /* Weekly Card Specifics */
    .weekly-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
    }

    .weekly-card-left {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .weekly-card-tag {
      font-size: 0.75rem;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.1em;
    }

    .weekly-card-title {
      font-size: 1.25rem;
      font-weight: 700;
    }

    .weekly-card-date {
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    /* Daily Calendar Grid */
    .daily-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
    }

    @media (min-width: 600px) {
      .daily-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .daily-card {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .daily-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .day-badge {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.25rem 0.5rem;
      border-radius: 6px;
      text-transform: uppercase;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-secondary);
    }

    .daily-card.has-data .day-badge {
      background: var(--success-bg);
      color: var(--success);
    }

    .card-status {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .daily-card.has-data .card-status {
      color: var(--success);
      font-weight: 500;
    }

    .daily-card-title {
      font-size: 1.05rem;
      font-weight: 600;
    }

    .daily-card-preview {
      font-size: 0.8rem;
      color: var(--text-secondary);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Missing/Dashed styled cards */
    .card.missing {
      border-style: dashed;
      opacity: 0.65;
      background: transparent;
      user-select: none;
    }

    .card.missing::before {
      display: none;
    }

    /* Tab: History Archive */
    .search-container {
      margin-bottom: 1.5rem;
      position: relative;
    }

    .search-input {
      width: 100%;
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 0.75rem 1rem 0.75rem 2.5rem;
      color: var(--text-primary);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.3s;
    }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-glow);
    }

    .search-icon {
      position: absolute;
      left: 0.85rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Month Collapse Layout */
    .month-group {
      margin-bottom: 1rem;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      background: var(--panel-bg);
    }

    .month-header {
      padding: 1rem;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.02);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
      transition: background 0.3s;
    }

    .month-header:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .month-toggle {
      font-size: 0.75rem;
      transition: transform 0.3s;
      color: var(--text-muted);
    }

    .month-group.collapsed .month-toggle {
      transform: rotate(-90deg);
    }

    .month-content {
      border-top: 1px solid var(--border-color);
      max-height: 1000px;
      transition: max-height 0.4s cubic-bezier(0, 1, 0, 1);
      overflow: hidden;
    }

    .month-group.collapsed .month-content {
      max-height: 0;
      border-top: none;
    }

    .history-list-item {
      padding: 1rem;
      border-bottom: 1px solid var(--border-color);
      cursor: pointer;
      transition: background 0.2s;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .history-list-item:last-child {
      border-bottom: none;
    }

    .history-list-item:hover {
      background: rgba(255, 255, 255, 0.03);
    }

    .history-item-info {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .history-item-title {
      font-weight: 500;
      font-size: 0.95rem;
    }

    .history-item-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      gap: 0.75rem;
    }

    .history-item-badge {
      background: var(--accent-glow);
      color: var(--accent);
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 700;
    }

    .history-item-badge.weekly {
      background: rgba(251, 191, 36, 0.1);
      color: var(--accent-gold);
    }

    /* Tab: Bookmarks & Notes */
    .bookmarks-list, .notes-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .empty-state {
      padding: 3rem 1.5rem;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      border: 1px dashed var(--border-color);
      border-radius: 12px;
    }

    /* Bottom Navigation Bar (Floating iOS Style) */
    .nav-bar {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(13, 18, 30, 0.8);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 30px;
      padding: 0.5rem 0.75rem;
      display: flex;
      justify-content: space-around;
      align-items: center;
      width: calc(100% - 2.5rem);
      max-width: 420px;
      box-shadow: 0 10px 40px 0 rgba(0, 0, 0, 0.5);
      z-index: 99;
    }

    [data-theme="light"] .nav-bar {
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(0, 0, 0, 0.1);
      box-shadow: 0 10px 40px 0 rgba(0, 0, 0, 0.08);
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.25rem;
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 0.75rem;
      font-weight: 500;
      padding: 0.4rem 0.5rem;
      cursor: pointer;
      transition: all 0.3s;
      border-radius: 20px;
      flex: 1;
      min-width: 0;
      white-space: nowrap;
    }

    .nav-item.active {
      color: var(--accent);
      background: var(--accent-glow);
    }

    .nav-item-icon {
      font-size: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Reader Sheet (Slide-over drawer) */
    .reader-sheet {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      background: var(--bg-color);
      z-index: 200;
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.4s cubic-bezier(0.1, 0.76, 0.55, 0.94);
      box-shadow: -10px 0 40px 0 rgba(0, 0, 0, 0.3);
    }

    @media (min-width: 768px) {
      .reader-sheet {
        width: 600px;
      }
    }

    .reader-sheet.active {
      transform: translateX(0);
    }

    .reader-header {
      background: var(--panel-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-color);
      padding: 1rem 1.5rem;
      padding-top: calc(1rem + env(safe-area-inset-top));
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .reader-header-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      min-width: 0;
      flex: 1;
      margin-right: 1rem;
    }

    .reader-title {
      font-size: 1.05rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      min-width: 0;
    }

    .reader-content {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      line-height: 1.7;
      color: var(--text-primary);
    }

    /* Markdown Rendering Styles inside Reader */
    .md-body {
      font-size: 1rem;
    }

    .md-body h1, .md-body h2 {
      margin-top: 1.5rem;
      margin-bottom: 1rem;
      font-weight: 700;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.3rem;
      color: var(--accent);
    }

    .md-body h3 {
      margin-top: 1.25rem;
      margin-bottom: 0.5rem;
      font-weight: 600;
      color: var(--text-primary);
      display: block;
      border-left: 3px solid var(--accent);
      padding-left: 0.5rem;
    }

    .md-body p {
      margin-bottom: 1rem;
    }

    .md-body ul, .md-body ol {
      margin-bottom: 1rem;
      padding-left: 1.25rem;
    }

    .md-body li {
      margin-bottom: 0.4rem;
    }

    .md-body a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px dashed var(--accent);
      transition: all 0.2s;
    }

    .md-body a:hover {
      color: var(--accent-hover);
      border-bottom-style: solid;
    }

    .md-body strong {
      font-weight: 700;
      color: var(--accent-gold);
    }

    /* Obsidian Jump Link Styling */
    .obsidian-jump-list {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 0.75rem;
      margin-bottom: 1.5rem;
      font-size: 0.85rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1rem;
      align-items: center;
    }

    /* User Notes Section inside Reader */
    .reader-notes-section {
      border-top: 1px solid var(--border-color);
      padding: 1.5rem;
      background: var(--panel-bg);
    }

    .notes-label {
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .notes-textarea {
      width: 100%;
      height: 80px;
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 0.5rem;
      color: var(--text-primary);
      font-size: 16px; /* Prevent iOS PWA viewport zooming layout shift */
      outline: none;
      resize: none;
      transition: border-color 0.3s;
      -webkit-user-select: text !important;
      user-select: text !important;
      pointer-events: auto !important;
    }

    .notes-textarea:focus {
      border-color: var(--accent);
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      top: 1.5rem;
      left: 50%;
      transform: translate(-50%, -100px);
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--accent);
      padding: 0.75rem 1.5rem;
      border-radius: 20px;
      z-index: 999;
      font-size: 0.85rem;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: transform 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      pointer-events: none;
    }

    .toast.active {
      transform: translate(-50%, 0);
    }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.1); opacity: 0.8; }
    }

    .spinner {
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Skeleton Loading Screen */
    .skeleton-screen {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--bg-color);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      transition: opacity 0.5s;
    }

    .skeleton-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.05);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
  </style>
</head>
<body>

  <!-- Loading Screen -->
  <div class="skeleton-screen" id="loading-screen">
    <div style="margin-bottom: 1.5rem; animation: pulse 2s infinite ease-in-out;">
      <svg class="brand-logo-svg" width="64" height="64" viewBox="0 0 100 100" fill="none">
        <circle cx="50" cy="50" r="46" stroke="var(--accent)" stroke-width="3" />
        <path d="M 50 4 A 46 46 0 0 0 50 96 Z" stroke="var(--accent)" stroke-width="2.5" />
        <path d="M 50 4 A 28 46 0 0 0 22 50 A 28 46 0 0 0 50 96" stroke="var(--accent)" stroke-width="2.5" />
        <path d="M 50 4 A 12 46 0 0 0 38 50 A 12 46 0 0 0 50 96" stroke="var(--accent)" stroke-width="2.5" stroke-opacity="0.8" />
        <path d="M 4 50 L 50 50" stroke="var(--accent)" stroke-width="2.5" />
        <path d="M 7.3 35 L 50 35" stroke="var(--accent)" stroke-width="2" stroke-opacity="0.8" />
        <path d="M 17.5 20 L 50 20" stroke="var(--accent)" stroke-width="2" stroke-opacity="0.8" />
        <path d="M 7.3 65 L 50 65" stroke="var(--accent)" stroke-width="2" stroke-opacity="0.8" />
        <path d="M 17.5 80 L 50 80" stroke="var(--accent)" stroke-width="2" stroke-opacity="0.8" />
        <path d="M 50 50 L 50 4" stroke="var(--accent)" stroke-width="2.5" />
        <path d="M 50 50 L 96 50" stroke="var(--accent)" stroke-width="2.5" />
        <path d="M 50 40 A 10 10 0 0 1 60 50" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" />
        <path d="M 50 30 A 20 20 0 0 1 70 50" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" />
        <path d="M 50 20 A 30 30 0 0 1 80 50" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" />
        <path d="M 50 10 A 40 40 0 0 1 90 50" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-opacity="0.6" />
      </svg>
    </div>
    <div style="font-family: 'Outfit', sans-serif; font-size: 1.25rem; font-weight: 700; letter-spacing: 0.15em; color: var(--accent); text-transform: uppercase;">NEWS RADAR</div>
  </div>

  <!-- Toast Notifier -->
  <div class="toast" id="toast-el">
    <span id="toast-icon" style="display: flex; align-items: center;"></span>
    <span id="toast-text">新聞已更新！</span>
  </div>

  <!-- Header -->
  <header>
    <div class="brand">
      <span class="brand-logo">
        <svg class="brand-logo-svg" width="28" height="28" viewBox="0 0 100 100" fill="none">

  <!-- App Logic script -->
  <script>
    // ==========================================
    // 1. IndexedDB Helper (SQLite-like Local Storage)
    // ==========================================
    const DB_NAME = 'NewsRadarLocalDB';
    const DB_VERSION = 1;
    let dbInstance = null;

    function initDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = event => {
          const db = event.target.result;
          if (!db.objectStoreNames.contains('bookmarks')) {
            db.createObjectStore('bookmarks', { keyPath: 'date' });
          }
          if (!db.objectStoreNames.contains('notes')) {
            db.createObjectStore('notes', { keyPath: 'date' });
          }
        };
        request.onsuccess = event => {
          dbInstance = event.target.result;
          resolve(dbInstance);
        };
        request.onerror = event => reject(event.target.error);
      });
    }

    const localStore = {
      getBookmark: (date) => {
        return new Promise(resolve => {
          const tx = dbInstance.transaction('bookmarks', 'readonly');
          const store = tx.objectStore('bookmarks');
          const req = store.get(date);
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => resolve(null);
        });
      },
      saveBookmark: (report) => {
        return new Promise(resolve => {
          const tx = dbInstance.transaction('bookmarks', 'readwrite');
          const store = tx.objectStore('bookmarks');
          store.put(report);
          tx.oncomplete = () => resolve(true);
        });
      },
      deleteBookmark: (date) => {
        return new Promise(resolve => {
          const tx = dbInstance.transaction('bookmarks', 'readwrite');
          const store = tx.objectStore('bookmarks');
          store.delete(date);
          tx.oncomplete = () => resolve(true);
        });
      },
      getAllBookmarks: () => {
        return new Promise(resolve => {
          const tx = dbInstance.transaction('bookmarks', 'readonly');
          const store = tx.objectStore('bookmarks');
          const req = store.getAll();
          req.onsuccess = () => resolve(req.result);
        });
      },
      getNote: (date) => {
        return new Promise(resolve => {
          const tx = dbInstance.transaction('notes', 'readonly');
          const store = tx.objectStore('notes');
          const req = store.get(date);
          req.onsuccess = () => resolve(req.result ? req.result.text : '');
          req.onerror = () => resolve('');
        });
      },
      saveNote: (date, text, title) => {
        return new Promise(resolve => {
          const tx = dbInstance.transaction('notes', 'readwrite');
          const store = tx.objectStore('notes');
          if (text.trim() === '') {
            store.delete(date);
          } else {
            store.put({ date, text, title, updated_at: new Date().toISOString() });
          }
          tx.oncomplete = () => resolve(true);
        });
      },
      getAllNotes: () => {
        return new Promise(resolve => {
          const tx = dbInstance.transaction('notes', 'readonly');
          const store = tx.objectStore('notes');
          const req = store.getAll();
          req.onsuccess = () => resolve(req.result);
        });
      }
    };

    // ==========================================
    // 2. Global State & Fetch Data
    // ==========================================
    let appData = { last_updated: "", daily: [], weekly: [] };
    let currentOpenReport = null;

    async function loadRadarData(bypassCache = false) {
      try {
        const url = bypassCache ? `data.json?t=${Date.now()}` : 'data.json';
        const res = await fetch(url);
        if (!res.ok) throw new Error("數據載入失敗");
        appData = await res.json();
        return true;
      } catch (e) {
        console.error("Error loading data:", e);
        return false;
      }
    }

    // ==========================================
    // 3. UI Render & Logic Helpers
    // ==========================================
    
    // Toggle Themes (Light vs Dark Slate)
    function initTheme() {
      const savedTheme = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
      updateThemeButtonIcon(savedTheme);
      
      document.getElementById('theme-btn').addEventListener('click', () => {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
        updateThemeButtonIcon(newTheme);
      });
    }

    function updateThemeButtonIcon(theme) {
      const btnSvg = document.getElementById('theme-icon-svg');
      if (theme === 'light') {
        // Sun Icon
        btnSvg.innerHTML = `
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        `;
      } else {
        // Moon Icon
        btnSvg.innerHTML = `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>`;
      }
    }

    // Toast Alert
    function showToast(text, iconHtml = null) {
      const el = document.getElementById('toast-el');
      const defaultIcon = `
        <svg width="16" height="16" viewBox="0 0 24 24" fill="var(--accent)" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L15 9l7 3-7 3-3 7-3-7-7-3 7-3z" />
        </svg>
      `;
      document.getElementById('toast-icon').innerHTML = iconHtml || defaultIcon;
      document.getElementById('toast-text').innerText = text;
      el.classList.add('active');
      setTimeout(() => el.classList.remove('active'), 2500);
    }

    // App Tab Switching
    function initNavigation() {
      const navItems = document.querySelectorAll('.nav-item');
      navItems.forEach(btn => {
        btn.addEventListener('click', () => {
          const tabId = btn.getAttribute('data-tab');
          
          navItems.forEach(n => n.classList.remove('active'));
          btn.classList.add('active');
          
          document.querySelectorAll('.app-tab-content').forEach(view => {
            view.classList.remove('active');
          });
          document.getElementById(tabId).classList.add('active');
          
          // Re-render subviews when switching tabs
          if (tabId === 'tab-bookmarks') {
            renderBookmarksAndNotes();
          }
        });
      });
    }

    // Get current week's dates (Monday to Sunday)
    function getWeekDates(referenceDate) {
      const curr = new Date(referenceDate);
      const day = curr.getDay(); // 0 is Sunday, 1 is Monday...
      // Adjust to Monday = 0, Sunday = 6
      const distance = day === 0 ? -6 : 1 - day;
      const monday = new Date(curr.setDate(curr.getDate() + distance));
      
      const dates = [];
      for (let i = 0; i < 7; i++) {
        const next = new Date(monday);
        next.setDate(monday.getDate() + i);
        dates.push(next.toISOString().split('T')[0]);
      }
      return dates;
    }

    // ==========================================
    // 4. View Renderers
    // ==========================================
    
    // Render Dashboard (This Week & Last Sunday Weekly Report)
    function renderDashboard() {
      // 1. Weekly summary card
      const weeklyContainer = document.getElementById('weekly-card-container');
      const today = new Date();
      
      // Calculate last Sunday
      const dayOfWeek = today.getDay();
      const daysToSunday = dayOfWeek === 0 ? 7 : dayOfWeek;
      const lastSunday = new Date(today);
      lastSunday.setDate(today.getDate() - daysToSunday);
      const lastSundayStr = lastSunday.toISOString().split('T')[0];
      
      // Find matching weekly report
      const weeklyReport = appData.weekly.find(w => w.date === lastSundayStr);
      
      if (weeklyReport) {
        weeklyContainer.innerHTML = `
          <div class="card weekly-card active" onclick="openReader('${weeklyReport.date}', true)">
            <div class="weekly-card-left">
              <span class="weekly-card-tag">WEEKLY SUMMARY</span>
              <span class="weekly-card-title">${weeklyReport.title}</span>
              <span class="weekly-card-date">彙整區間：${lastSundayStr} 前七天新聞數據</span>
            </div>
            <div style="color: var(--accent); display: flex; align-items: center; justify-content: center; padding-right: 0.5rem;">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="9 18 15 12 9 6"></polyline>
              </svg>
            </div>
          </div>
        `;
      } else {
        weeklyContainer.innerHTML = `
          <div class="card weekly-card missing">
            <div class="weekly-card-left">
              <span class="weekly-card-tag" style="color: var(--text-muted);">WEEKLY SUMMARY</span>
              <span class="weekly-card-title" style="color: var(--text-muted);">上週每週週報</span>
              <span class="weekly-card-date">週報報告尚未生成或從缺</span>
            </div>
            <span class="card-status">從缺</span>
          </div>
        `;
      }

      // 2. Daily grid (Monday to Sunday)
      const dailyContainer = document.getElementById('daily-grid-container');
      const weekDates = getWeekDates(new Date());
      const dayNames = ["星期一", "星期二", "星期三", "星期四", "星期五", "星期六", "星期日"];
      const dayEn = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
      
      let gridHTML = "";
      weekDates.forEach((dateStr, index) => {
        // Find matching daily report
        const report = appData.daily.find(r => r.date === dateStr);
        
        if (report) {
          // Generate key headline bullet points preview
          let headlinesList = "";
          if (report.headlines && report.headlines.length > 0) {
            headlinesList = report.headlines.slice(0, 2).map(h => `<li>${h.title}</li>`).join('');
            headlinesList = `<ul style="margin-top: 0.4rem; padding-left: 1rem; color: var(--text-secondary); font-size: 0.8rem; line-height: 1.4;">${headlinesList}</ul>`;
          }
          
          gridHTML += `
            <div class="card daily-card has-data active" onclick="openReader('${dateStr}', false)">
              <div class="daily-card-header">
                <span class="day-badge">${dayEn[index]} ${dateStr.slice(5)}</span>
                <span class="card-status">● 已更新</span>
              </div>
              <div class="daily-card-title">${dayNames[index]}新聞雷達</div>
              ${headlinesList}
            </div>
          `;
        } else {
          gridHTML += `
            <div class="card daily-card missing">
              <div class="daily-card-header">
                <span class="day-badge">${dayEn[index]} ${dateStr.slice(5)}</span>
                <span class="card-status">從缺</span>
              </div>
              <div class="daily-card-title" style="color: var(--text-muted); font-weight: 500;">新聞雷達</div>
              <div class="daily-card-preview" style="color: var(--text-muted); font-size: 0.75rem;">當日新聞簡報未生成</div>
            </div>
          `;
        }
      });
      dailyContainer.innerHTML = gridHTML;
    }

    // Render History Archive (grouped by month)
    function renderHistory(filteredDaily = null, filteredWeekly = null) {
      const container = document.getElementById('history-groups-container');
      const dailyList = filteredDaily || appData.daily;
      const weeklyList = filteredWeekly || appData.weekly;
      
      // Combine all and sort descending
      const allReports = [];
      dailyList.forEach(r => allReports.push({ ...r, type: 'daily' }));
      weeklyList.forEach(w => allReports.push({ ...w, type: 'weekly' }));
      allReports.sort((a, b) => b.date.localeCompare(a.date));
      
      if (allReports.length === 0) {
        container.innerHTML = `<div class="empty-state">沒有符合條件的歷史報告</div>`;
        return;
      }
      
      // Group by Year - Month (e.g. "2026 年 06 月")
      const groups = {};
      allReports.forEach(r => {
        const year = r.date.slice(0, 4);
        const month = r.date.slice(5, 7);
        const key = `${year} 年 ${month} 月`;
        if (!groups[key]) groups[key] = [];
        groups[key].push(r);
      });
      
      let html = "";
      Object.keys(groups).forEach(monthKey => {
        const items = groups[monthKey];
        const isCollapsed = false; // Keep open by default
        
        const itemsHTML = items.map(item => {
          const badgeClass = item.type === 'weekly' ? 'weekly' : '';
          const badgeLabel = item.type === 'weekly' ? '每週週報' : '每日雷達';
          
          return `
            <div class="history-list-item" onclick="openReader('${item.date}', ${item.type === 'weekly'})">
              <div class="history-item-info">
                <span class="history-item-title">${item.title}</span>
                <div class="history-item-meta">
                  <span>${item.date}</span>
                  <span class="history-item-badge ${badgeClass}">${badgeLabel}</span>
                </div>
              </div>
              <div style="color: var(--text-muted); display: flex; align-items: center;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
              </div>
            </div>
          `;
        }).join('');
        
        html += `
          <div class="month-group">
            <div class="month-header" onclick="toggleMonthGroup(this)">
              <span>${monthKey} (${items.length} 篇)</span>
              <span class="month-toggle">▼</span>
            </div>
            <div class="month-content">
              ${itemsHTML}
            </div>
          </div>
        `;
      });
      container.innerHTML = html;
    }

    function toggleMonthGroup(headerEl) {
      const group = headerEl.parentElement;
      group.classList.toggle('collapsed');
    }

    // Render Bookmarks & Notes Tab
    async function renderBookmarksAndNotes() {
      // 1. Bookmarks list
      const bookmarksList = await localStore.getAllBookmarks();
      const bContainer = document.getElementById('bookmarks-list-container');
      
      if (bookmarksList.length === 0) {
        bContainer.innerHTML = `<div class="empty-state">尚未收藏任何報告</div>`;
      } else {
        bContainer.innerHTML = bookmarksList.map(item => `
          <div class="history-list-item" style="background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 12px;" onclick="openReader('${item.date}', ${item.is_weekly})">
            <div class="history-item-info">
              <span class="history-item-title">${item.title}</span>
              <div class="history-item-meta">
                <span>${item.date}</span>
                <span class="history-item-badge ${item.is_weekly ? 'weekly' : ''}">${item.is_weekly ? '每週週報' : '每日雷達'}</span>
              </div>
            </div>
            <div style="display: flex; align-items: center; gap: 0.5rem;">
              <span style="color: var(--accent-gold); display: flex; align-items: center;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="var(--accent-gold)" stroke="var(--accent-gold)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 2L15 9l7 3-7 3-3 7-3-7-7-3 7-3z" />
                </svg>
              </span>
              <div style="color: var(--text-muted); display: flex; align-items: center;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
              </div>
            </div>
          </div>
        `).join('');
      }

      // 2. Notes list
      const notesList = await localStore.getAllNotes();
      const nContainer = document.getElementById('notes-list-container');
      
      if (notesList.length === 0) {
        nContainer.innerHTML = `<div class="empty-state">目前還沒有撰寫筆記</div>`;
      } else {
        nContainer.innerHTML = notesList.map(note => `
          <div class="history-list-item" style="background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 12px; align-items: flex-start; flex-direction: column; gap: 0.5rem;" onclick="openReader('${note.date}', ${note.title.includes('週報')})">
            <div style="display: flex; justify-content: space-between; width: 100%; align-items: center;">
              <span class="history-item-title" style="font-weight: 700;">${note.title}</span>
              <span style="font-size: 0.75rem; color: var(--text-muted);">更新於 ${note.updated_at.slice(0, 10)}</span>
            </div>
            <div style="font-size: 0.85rem; color: var(--text-secondary); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; width: 100%;">
              ${escapeHTML(note.text)}
            </div>
          </div>
        `).join('');
      }
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    // ==========================================
    // 5. Custom Markdown Parser (Fast & Local)
    // ==========================================
    function parseMarkdownToHTML(md) {
      // 1. Strip raw frontmatter codeblocks if present
      let content = md.replace(/```markdown\s*/g, '').replace(/```\s*$/g, '').trim();
      
      // 2. Strip NotebookLM citation tags like [1], [^1]
      content = content.replace(/\[\^\d+\]/g, '');
      content = content.replace(/\[\d+(?:\s*,\s*\d+)*\]/g, '');
      
      const lines = content.split('\n');
      let html = [];
      let inList = false;
      
      // We will parse Obsidian jump links first: 👉 **快速跳轉**：[[#一、 上週大勢點評|上週大勢點評]]
      // Convert them to native HTML anchors linking to the specific section index
      
      for (let i = 0; i < lines.length; i++) {
        let line = lines[i].trim().replace(/[👉⚡]\s*/g, '').replace(/^✦\s*/g, '');
        
        // Handle Empty Lines
        if (line === '') {
          if (inList) {
            html.push('</ul>');
            inList = false;
          }
          continue;
        }

        // Jump Link Box
        if (line.includes('快速跳轉') || line.includes('👉')) {
          if (inList) { html.push('</ul>'); inList = false; }
          // Replace Obsidian [[#heading|label]] with local anchor link
          let processedLine = line.replace(/\[\[#(.*?)\|(.*?)\]\]/g, (match, anchor, label) => {
            const safeAnchor = encodeURIComponent(anchor.trim());
            return `<a href="#${safeAnchor}">${label}</a>`;
          });
          // Replace markdown strong **text**
          processedLine = processedLine.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
          html.push(`<div class="obsidian-jump-list">${processedLine}</div>`);
          continue;
        }

        // Headings: H1, H2, H3
        if (line.startsWith('# ')) {
          if (inList) { html.push('</ul>'); inList = false; }
          const title = line.replace('# ', '').trim();
          const cleanTitle = title.replace(/\^summary-top/g, '');
          html.push(`<h1 style="margin-bottom: 1rem; color: var(--accent);">${cleanTitle}</h1>`);
          continue;
        }
        
        if (line.startsWith('## ')) {
          if (inList) { html.push('</ul>'); inList = false; }
          let title = line.replace('## ', '').trim();
          const safeAnchor = encodeURIComponent(title);
          
          let iconPrefix = '';
          // If the title contains "今日最速報" (handling cases where emoji was already stripped)
          if (title.includes('今日最速報') || title.includes('今日最速')) {
            iconPrefix = `
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display: inline-block; vertical-align: middle; margin-right: 0.5rem; color: var(--accent);">
                <path d="M22 12h-4l-3 9L9 3l-3 9H2" />
              </svg>
            `;
          } else {
            // General sections get a small geometric gold diamond badge
            iconPrefix = `
              <svg width="8" height="8" viewBox="0 0 24 24" fill="var(--accent-gold)" stroke="var(--accent-gold)" stroke-width="2" style="display: inline-block; vertical-align: middle; margin-right: 0.6rem; opacity: 0.85;">
                <polygon points="12 2 22 12 12 22 2 12"></polygon>
              </svg>
            `;
          }
          
          html.push(`<h2 id="${safeAnchor}">${iconPrefix}<span style="vertical-align: middle;">${title}</span></h2>`);
          continue;
        }
        
        if (line.startsWith('### ')) {
          if (inList) { html.push('</ul>'); inList = false; }
          const title = line.replace('### ', '').trim();
          
          // Parse title link format: "1. Title ([Source](URL))"
          let parsedTitle = title;
          // Look for source links inside parenthesis (handling nested parentheses in Lancet URLs)
          parsedTitle = parsedTitle.replace(/\[([^\]]+)\]\((https?:\/\/[^\s()]+(?:\([^\s()]+\)[^\s()]*)*)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1 🔗</a>');
          // Parse strong bold highlights in heading
          parsedTitle = parsedTitle.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
          
          html.push(`<h3>${parsedTitle}</h3>`);
          continue;
        }

        // Bullet Lists
        if (line.startsWith('- ') || line.startsWith('* ')) {
          if (!inList) {
            html.push('<ul style="margin-left: 1.25rem; margin-bottom: 1rem;">');
            inList = true;
          }
          let itemText = line.substring(2);
          // Parse links in bullets (handling nested parentheses in Lancet URLs)
          itemText = itemText.replace(/\[([^\]]+)\]\((https?:\/\/[^\s()]+(?:\([^\s()]+\)[^\s()]*)*)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
          // Parse bold text
          itemText = itemText.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
          html.push(`<li style="margin-bottom: 0.4rem;">${itemText}</li>`);
          continue;
        }

        // Paragraphs & general texts
        if (inList) {
          html.push('</ul>');
          inList = false;
        }
        
        let pText = line;
        pText = pText.replace(/\[([^\]]+)\]\((https?:\/\/[^\s()]+(?:\([^\s()]+\)[^\s()]*)*)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
        pText = pText.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        html.push(`<p style="margin-bottom: 1rem;">${pText}</p>`);
      }
      
      if (inList) {
        html.push('</ul>');
      }
      
      return `<div class="md-body">${html.join('\n')}</div>`;
    }

    // ==========================================
    // 6. Reader Drawer Controller
    // ==========================================
    async function openReader(date, isWeekly = false) {
      const report = isWeekly 
        ? appData.weekly.find(w => w.date === date)
        : appData.daily.find(d => d.date === date);
        
      if (!report) {
        showToast("找不到該報告！", `
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ff6b6b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="15" y1="9" x2="9" y2="15"></line>
            <line x1="9" y1="9" x2="15" y2="15"></line>
          </svg>
        `);
        return;
      }

      currentOpenReport = { ...report, is_weekly: isWeekly };
      
      const drawer = document.getElementById('reader-sheet');
      const titleEl = document.getElementById('reader-title-text');
      const bodyEl = document.getElementById('reader-content-body');
      const noteInput = document.getElementById('reader-note-input');
      const bookmarkBtn = document.getElementById('reader-bookmark-btn');

      // 0. Push history state if not already there (prevents native back swipe from unloading page)
      if (window.location.hash !== '#reader') {
        history.pushState({ readerOpen: true }, '', '#reader');
      }

      // 1. Initial State UI
      titleEl.innerText = report.title;
      bodyEl.innerHTML = `<div style="padding: 3rem; text-align: center; color: var(--text-secondary);"><div class="skeleton-spinner" style="margin: 0 auto 1rem auto;"></div>讀取報告檔案中...</div>`;
      
      // Clear or load Note
      const savedNote = await localStore.getNote(date);
      noteInput.value = savedNote;
      
      // Update bookmark button star state
      const isBookmarked = await localStore.getBookmark(date);
      const bookmarkIcon = document.getElementById('reader-bookmark-icon');
      if (isBookmarked) {
        bookmarkIcon.setAttribute('fill', 'var(--accent-gold)');
        bookmarkIcon.setAttribute('stroke', 'var(--accent-gold)');
      } else {
        bookmarkIcon.setAttribute('fill', 'none');
        bookmarkIcon.setAttribute('stroke', 'currentColor');
      }
      
      // Make sure inline styles are cleared and active class is applied
      drawer.style.transform = '';
      drawer.style.transition = '';
      drawer.classList.add('active');

      // 2. Fetch Markdown file content
      try {
        const res = await fetch(report.file_path);
        if (!res.ok) throw new Error("無法讀取此報告檔案，請確認網路或檔案存在。");
        const mdText = await res.text();
        
        // Render
        bodyEl.innerHTML = parseMarkdownToHTML(mdText);
        
      } catch (err) {
        bodyEl.innerHTML = `
          <div style="padding: 2rem; text-align: center; color: var(--text-muted);">
            <p>❌ 讀取報告內容失敗</p>
            <p style="font-size: 0.8rem; margin-top: 0.5rem;">${err.message}</p>
          </div>
        `;
      }
    }

    function initReaderClose() {
      // Close sheet via history back if hash is set
      document.getElementById('reader-close').addEventListener('click', () => {
        if (window.location.hash === '#reader') {
          history.back();
        } else {
          closeReader();
        }
      });
      
      // Bookmark toggle
      document.getElementById('reader-bookmark-btn').addEventListener('click', async () => {
        if (!currentOpenReport) return;
        const key = currentOpenReport.date;
        const exists = await localStore.getBookmark(key);
        
        const bookmarkIcon = document.getElementById('reader-bookmark-icon');
        if (exists) {
          await localStore.deleteBookmark(key);
          bookmarkIcon.setAttribute('fill', 'none');
          bookmarkIcon.setAttribute('stroke', 'currentColor');
          showToast("已從收藏夾移除", `
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-muted);">
              <path d="M12 2L15 9l7 3-7 3-3 7-3-7-7-3 7-3z" />
            </svg>
          `);
        } else {
          await localStore.saveBookmark(currentOpenReport);
          bookmarkIcon.setAttribute('fill', 'var(--accent-gold)');
          bookmarkIcon.setAttribute('stroke', 'var(--accent-gold)');
          showToast("已儲存至收藏夾", `
            <svg width="16" height="16" viewBox="0 0 24 24" fill="var(--accent-gold)" stroke="var(--accent-gold)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2L15 9l7 3-7 3-3 7-3-7-7-3 7-3z" />
            </svg>
          `);
        }
      });

      // Auto save note typing
      let noteTimeout = null;
      const noteInput = document.getElementById('reader-note-input');
      
      noteInput.addEventListener('input', (e) => {
        if (!currentOpenReport) return;
        
        // Debounce saving note
        clearTimeout(noteTimeout);
        noteTimeout = setTimeout(async () => {
          const text = e.target.value;
          await localStore.saveNote(currentOpenReport.date, text, currentOpenReport.title);
        }, 800);
      });

      // Stop touch event propagation to prevent parent drawer swipe-to-close handlers from hijacking focus.
      // Explicitly call focus() on user click/touchend to bypass WebKit programmatic focus restrictions.
      const handleNoteFocus = (e) => {
        e.stopPropagation();
        noteInput.focus();
      };

      noteInput.addEventListener('touchstart', (e) => {
        e.stopPropagation();
      }, { passive: true });

      noteInput.addEventListener('touchmove', (e) => {
        e.stopPropagation();
      }, { passive: true });

      noteInput.addEventListener('touchend', handleNoteFocus);
      noteInput.addEventListener('click', handleNoteFocus);
    }

    function closeReader() {
      const sheet = document.getElementById('reader-sheet');

      // Force transition to 100% offscreen smoothly
      sheet.style.transition = 'transform 0.3s cubic-bezier(0.1, 0.76, 0.55, 0.94)';
      sheet.style.transform = 'translateX(100%)';
      sheet.classList.remove('active');
      
      setTimeout(() => {
        sheet.style.transform = '';
        sheet.style.transition = '';
      }, 300);

      currentOpenReport = null;
      // If we were on Bookmarks tab, refresh it
      if (document.querySelector('.nav-item[data-tab="tab-bookmarks"]').classList.contains('active')) {
        renderBookmarksAndNotes();
      }
    }

    function initSwipeToClose() {
      const sheet = document.getElementById('reader-sheet');
      let startX = 0;
      let startY = 0;
      let currentX = 0;
      let isDragging = false;
      let isSwipeHorizontal = false;

      sheet.addEventListener('touchstart', (e) => {
        // Swipe to close triggers when starting touch in the left 80px of the screen/sheet (feels native like iOS back swipe)
        const touch = e.touches[0];
        if (touch.clientX < 80) {
          startX = touch.clientX;
          startY = touch.clientY;
          isDragging = true;
          isSwipeHorizontal = false;
          sheet.style.transition = 'none'; // 1:1 follow user finger
        }
      }, { passive: true });

      sheet.addEventListener('touchmove', (e) => {
        if (!isDragging) return;
        const touch = e.touches[0];
        const dx = touch.clientX - startX;
        const dy = touch.clientY - startY;

        // If swipe is primarily horizontal and moving to the right
        if (!isSwipeHorizontal && dx > 10 && Math.abs(dx) > Math.abs(dy) * 1.5) {
          isSwipeHorizontal = true;
        }

        if (isSwipeHorizontal && dx > 0) {
          if (e.cancelable) e.preventDefault(); // Prevent vertical scroll jank
          currentX = dx;
          sheet.style.transform = `translateX(${dx}px)`;
        }
      }, { passive: false });

      sheet.addEventListener('touchend', (e) => {
        if (!isDragging) return;
        isDragging = false;
        
        // If swiped more than 120px to the right, close it, otherwise bounce back
        if (isSwipeHorizontal && currentX > 120) {
          if (window.location.hash === '#reader') {
            history.back();
          } else {
            closeReader();
          }
        } else {
          sheet.style.transition = 'transform 0.3s cubic-bezier(0.1, 0.76, 0.55, 0.94)';
          sheet.style.transform = 'translateX(0)';
        }
        isSwipeHorizontal = false;
        currentX = 0;
      });
      
      // Global popstate history hook
      window.addEventListener('popstate', () => {
        if (sheet.classList.contains('active')) {
          closeReader();
        }
      });
    }

    // ==========================================
    // 7. Search Feature
    // ==========================================
    function initSearch() {
      const searchInput = document.getElementById('history-search');
      searchInput.addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase().trim();
        if (query === '') {
          renderHistory();
          return;
        }
        
        // Filter daily reports
        const filteredDaily = appData.daily.filter(report => {
          const inDate = report.date.includes(query);
          const inTitle = report.title.toLowerCase().includes(query);
          const inHeadlines = report.headlines && report.headlines.some(h => 
            h.title.toLowerCase().includes(query) || h.source.toLowerCase().includes(query)
          );
          return inDate || inTitle || inHeadlines;
        });

        // Filter weekly reports
        const filteredWeekly = appData.weekly.filter(report => {
          const inDate = report.date.includes(query);
          const inTitle = report.title.toLowerCase().includes(query);
          return inDate || inTitle;
        });

        renderHistory(filteredDaily, filteredWeekly);
      });
    }

    // ==========================================
    // 8. Mailbox Refresh Controller
    // ==========================================
    function initRefresh() {
      const refreshBtn = document.getElementById('refresh-btn');
      const refreshIcon = document.getElementById('refresh-icon-svg');
      
      refreshBtn.addEventListener('click', async () => {
        refreshBtn.disabled = true;
        refreshIcon.classList.add('spinner');
        showToast("正在拉取最新新聞數據...", `
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="spinner">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M12 2a10 10 0 0 1 10 10"></path>
          </svg>
        `);
        
        const success = await loadRadarData(true);
        
        setTimeout(() => {
          refreshIcon.classList.remove('spinner');
          refreshBtn.disabled = false;
          
          if (success) {
            renderDashboard();
            renderHistory();
            showToast("數據更新成功！", `
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            `);
          } else {
            showToast("拉取失敗，請確認網路連線", `
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ff6b6b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="15" y1="9" x2="9" y2="15"></line>
                <line x1="9" y1="9" x2="15" y2="15"></line>
              </svg>
            `);
          }
        }, 1000);
      });
    }

    // ==========================================
    // 9. App Lifecycle Entry
    // ==========================================
    window.addEventListener('DOMContentLoaded', async () => {
      // Clean up hash if page reloaded on #reader state
      if (window.location.hash === '#reader') {
        history.replaceState(null, '', window.location.pathname + window.location.search);
      }

      // 1. Initialize local databases
      try {
        await initDB();
      } catch (err) {
        console.error("IndexedDB load failed:", err);
      }

      // 2. Fetch data
      await loadRadarData();

      // 3. Render and initialize views
      initTheme();
      initNavigation();
      initSearch();
      initReaderClose();
      initSwipeToClose();
      initRefresh();
      
      renderDashboard();
      renderHistory();

      // Hide loading screen
      const loadingScreen = document.getElementById('loading-screen');
      loadingScreen.style.opacity = '0';
      setTimeout(() => loadingScreen.remove(), 500);

      // Register Service Worker for PWA offline capabilities
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js')
          .then(() => console.log("Service worker registered!"))
          .catch(err => console.log("Service worker failed:", err));
      }
    });
  </script>
